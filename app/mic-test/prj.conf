# Mic test app: record from the MP34DT05 PDM mic (pdm20) while the boot button
# is held; store the clip as a WAV to the mic_clip flash partition.
CONFIG_GPIO=y

# LED API + GPIO backend, for the 16-LED "recording" indicator. Unlike the DMIC
# and sensor drivers, the gpio-leds driver does NOT auto-enable from its DT node:
# its Kconfig is sourced only `if LED`, so CONFIG_LED must be set explicitly
# (same as led-test / sensor-test).
CONFIG_LED=y
CONFIG_LED_GPIO=y

# DMIC / PDM. The nrfx PDM driver (CONFIG_AUDIO_DMIC_NRFX_PDM) auto-enables from
# the enabled pdm20 devicetree node, so it is NOT listed here.
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Flash map API for writing the WAV clip to the mic_clip partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# store_save_wav() runs on the main thread and descends into the RRAM flash
# driver with ~300 B of buffers on the stack — the deepest main-thread path
# here. Bump the main stack off the 1 KB default (matches led-test/sensor-test).
CONFIG_MAIN_STACK_SIZE=2048

# This app does not enable CONFIG_SENSOR, so the shared LIS2DH node in
# phial-common.dtsi is inert here. The BME280 driver is `default y` whenever its
# node is present, so disable it explicitly to keep it out of this audio app.
CONFIG_BME280=n

# Bringup diagnostic: Segger RTT as console + interactive shell, mirrors the
# sibling apps. shell-common.conf enables CONFIG_SHELL_BACKEND_SERIAL +
# CONFIG_SHELL_LOG_BACKEND, so logs route via the shell. Do NOT enable
# CONFIG_LOG_BACKEND_RTT (fights the shell over RTT channel 0) or a separate
# CONFIG_LOG_BACKEND_UART (would double-log on the UART).
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_UART_CONSOLE=y
