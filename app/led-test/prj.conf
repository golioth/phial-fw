# LED API + GPIO backend (Phase 1)
CONFIG_LED=y
CONFIG_LED_GPIO=y

# Subsystems used by the app
CONFIG_GPIO=y
CONFIG_I2C=y                    # not used by code yet, but the bus must be
                                # available so `i2c scan` in the shell works.

# Slightly larger main stack — animation thread + shell + log
CONFIG_MAIN_STACK_SIZE=2048

# Bringup diagnostic: Segger RTT as console + interactive shell.
# RTT runs over SWD so it works even if UART pinctrl is wrong for this board.
# Open with `JLinkRTTViewer` (Segger) or `nrfutil device rtt` after `west flash`.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
# Shell over RTT.  shell-common.conf already enables
# CONFIG_SHELL_LOG_BACKEND=y, so log messages route via the shell to RTT
# (and also harmlessly to the dead UART). Do NOT also enable
# CONFIG_LOG_BACKEND_RTT — it'd fight the shell over RTT channel 0.
CONFIG_SHELL_BACKEND_RTT=y

# UART console: now that pinctrl is routed to the Phial debug-header
# pins (P1.08 TX / P1.07 RX via Tag-Connect J103), the shell is also
# available over serial UART.  shell-common.conf already enables
# CONFIG_SHELL_BACKEND_SERIAL=y; its shell log backend carries UART logs,
# so we deliberately do NOT enable a separate CONFIG_LOG_BACKEND_UART.
CONFIG_UART_CONSOLE=y

# Note: the shared boards/phial-common.dtsi defines sensor nodes (bme280@76,
# lis2dh12@18), but led-test does not enable CONFIG_SENSOR, so no sensor driver
# Kconfigs are sourced and no sensor driver is compiled in — the nodes are inert
# here. (Enabling CONFIG_SENSOR would auto-enable those drivers from the DT
# nodes alone; no per-driver CONFIG_* needed.)

# (Phase 2 will add):   CONFIG_LED_PWM=y / CONFIG_PWM=y
# (Phase 3 BLE adds):   CONFIG_BT=y / CONFIG_BT_PERIPHERAL=y / CONFIG_BT_SHELL=y
