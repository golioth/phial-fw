# LED API + GPIO backend (Phase 1)
CONFIG_LED=y
CONFIG_LED_GPIO=y

# Subsystems used by the app
CONFIG_GPIO=y
CONFIG_I2C=y                    # not used by code yet, but the bus must be
                                # available so `i2c scan` in the shell works.

# Slightly larger main stack — animation thread + shell + log
CONFIG_MAIN_STACK_SIZE=2048

# Bringup diagnostic: Segger RTT as a parallel console.
# RTT runs over SWD so it works even if UART pinctrl is wrong for this board.
# Open with `JLinkRTTViewer` (Segger) or `nrfutil device rtt` after `west flash`.
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
# CONFIG_SHELL_BACKEND_RTT — disabled to avoid RTT channel-0 conflict
# with CONFIG_LOG_BACKEND_RTT. The shell stays on the serial backend
# (UART, broken on this board until pinctrl is fixed). RTT is for
# log+printk diagnostic only during bringup.

# (Phase 2 will add):   CONFIG_LED_PWM=y / CONFIG_PWM=y
# (Phase 3 BLE adds):   CONFIG_BT=y / CONFIG_BT_PERIPHERAL=y / CONFIG_BT_SHELL=y
# (Phase 4 Pouch adds): CONFIG_GOLIOTH_*=y / CONFIG_BOOTLOADER_MCUBOOT=y
