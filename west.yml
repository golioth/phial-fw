manifest:
  version: 1.0

  projects:
    # NCS pinned directly at v3.2.3 (pouch's verified version). Imports the
    # Zephyr/NCS module set under deps/ via name-allowlist. This replaces the
    # previous indirect import through golioth-firmware-sdk's west-ncs.yml.
    - name: nrf
      path: nrf                  # import.path-prefix below prepends "deps/" -> deps/nrf
      revision: v3.2.3
      url: https://github.com/nrfconnect/sdk-nrf
      import:
        path-prefix: deps
        name-allowlist:
          - nrf
          - zephyr
          - cmsis_6
          - hal_nordic
          - mbedtls
          - mbedtls-nrf
          - mcuboot
          - net-tools
          - nrfxlib
          - oberon-psa-crypto
          - qcbor
          - segger
          - tfm-mcuboot
          - tinycrypt
          - trusted-firmware-m
          - zcbor
          - littlefs

    # Classic Golioth firmware SDK, pinned at the commit pouch verifies against.
    - name: golioth
      path: deps/modules/lib/golioth-firmware-sdk
      revision: d703b1f8805c7584a44dabc31bdf09164637d888
      url: https://github.com/golioth/golioth-firmware-sdk.git
      west-commands: scripts/west-commands.yml
      submodules: true

    # Pouch transport + its in-tree golioth_sdk (Stream/Settings/OTA).
    # Pinned to the SHA verified against this workspace (NCS 3.2.3 + golioth
    # d703b1f). Pouch has no release tags yet; bump this SHA + re-verify to advance.
    - name: pouch
      path: deps/modules/lib/pouch
      revision: f7d0dc96a7a650e6fcaa9c1444dedf85c64ebc54
      url: https://github.com/golioth/pouch.git
      submodules: true

  self:
    path: phial-fw
